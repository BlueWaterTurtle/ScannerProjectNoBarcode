[package]
name = "scanner_rs"
version = "0.1.0"
edition = "2024"
description = "Watches a directory for PNG files, extracts PO numbers via Tesseract OCR, and renames/moves them accordingly."

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
notify = "6.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
